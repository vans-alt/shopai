server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # every /api call goes to the API gateway (the only backend the browser talks to)
  location /api/ {
    proxy_pass http://gateway:8000;   # docker-compose service name / Kubernetes Service name
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 30s;
  }
  location / {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files $uri /index.html;
  }
}
