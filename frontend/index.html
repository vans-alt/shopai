<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShopAI</title>
<style>
  :root{--bg:#f6f7fb;--card:#fff;--text:#1d2433;--muted:#6b7280;--brand:#4f46e5;--line:#e5e7eb}
  @media (prefers-color-scheme:dark){:root{--bg:#10131c;--card:#1a1f2e;--text:#e8eaf0;--muted:#9aa3b5;--brand:#6366f1;--line:#2a3142}}
  *{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
  header{display:flex;gap:12px;align-items:center;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
  header h1{margin:0;font-size:20px;color:var(--brand)}
  input,select,button{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text)}
  #q{flex:1;min-width:180px}button{cursor:pointer}.primary{background:var(--brand);color:#fff;border:0}
  main{max-width:1100px;margin:0 auto;padding:20px}h2{font-size:17px;margin:24px 0 10px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
  .emoji{font-size:44px;text-align:center}.price{font-weight:700}.muted{color:var(--muted);font-size:13px}
  .row{display:flex;gap:6px;margin-top:auto}.row button{flex:1;font-size:13px}
  .cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
  .cat{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
  .cat.active{border-color:var(--brand)}.cat b{font-size:16px}.cat .big{font-size:28px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 8px}.chips button{font-size:12px;padding:5px 10px;border-radius:999px}
  .mini{align-self:flex-start;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;display:flex;gap:8px;align-items:center;max-width:92%}
  .mini span.n{flex:1}.mini button{padding:4px 8px;font-size:12px}
  #chatHead{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
  #chatHead b{flex:1}#mode{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--muted)}
  #chatHead button{padding:4px 10px;font-size:12px}.typing{opacity:.6;font-style:italic}
  #chatBtn{position:fixed;right:20px;bottom:20px;border-radius:999px;padding:14px 18px}
  #chat{position:fixed;right:20px;bottom:76px;width:340px;max-width:calc(100vw - 40px);height:460px;background:var(--card);border:1px solid var(--line);border-radius:14px;display:none;flex-direction:column;overflow:hidden}
  #chat.open{display:flex}#log{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
  .msg{padding:8px 12px;border-radius:12px;max-width:85%;white-space:pre-wrap;font-size:14px}
  .me{align-self:flex-end;background:var(--brand);color:#fff}.bot{align-self:flex-start;background:var(--bg)}
  #chatForm{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line)}#chatForm input{flex:1}
  #drawer{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:20;justify-content:flex-end}
  #drawer.open{display:flex}#panel{background:var(--card);width:400px;max-width:100vw;height:100%;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .line{display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0;font-size:14px}.line .n{flex:1}
  .line button{padding:2px 8px}.sum{display:flex;justify-content:space-between;font-size:14px}.sum.t{font-weight:700;font-size:16px}
  #panel input,#panel select{width:100%;margin-top:6px}.ok{color:#16a34a;font-weight:600}.err{color:#dc2626;font-size:13px}
  .order{border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px}
</style>
</head>
<body>
<header>
  <h1>🛍️ ShopAI</h1>
  <input id="q" placeholder="Search products (typos are OK)…">
  <select id="cat"><option value="">All categories</option></select>
  <select id="sort"><option value="relevance">Relevance</option><option value="price_asc">Price ↑</option><option value="price_desc">Price ↓</option></select>
  <button id="ordersBtn">📦 Orders</button>
  <button class="primary" id="cartBtn">🛒 Cart (<span id="cartN">0</span>)</button>
</header>
<div id="warn" style="display:none;background:#fef3c7;color:#92400e;padding:10px 20px;font-size:14px"></div>
<main>
  <h2>Shop by category</h2><div class="cats" id="cats"></div>
  <h2 id="title">Products</h2><p class="muted" id="catDesc"></p><div class="grid" id="grid"></div>
  <h2>✨ Recommended for you</h2><div class="grid" id="recs"></div>
</main>
<div class="muted" id="ver" style="text-align:center;padding:16px">…</div>
<div id="drawer"><div id="panel"></div></div>
<button class="primary" id="chatBtn">💬 Ask AI</button>
<div id="chat">
  <div id="chatHead"><b>🤖 ShopAI Assistant</b><span id="mode">…</span><button type="button" id="newChat">New chat</button></div>
  <div id="log"><div class="msg bot">Hi! I can search products, compare them, add items to your cart and answer questions about delivery and returns.</div></div>
  <div class="chips" id="chips"></div>
  <form id="chatForm"><input id="chatIn" placeholder="e.g. gift for a gym lover under 4000" autocomplete="off"><button class="primary">Send</button></form>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const load=k=>{try{return JSON.parse(localStorage.getItem(k))||[]}catch{return []}};
let viewed=load('viewed'), history=[];
const save=()=>{try{localStorage.setItem('viewed',JSON.stringify(viewed))}catch{}};
// Cart lives in cart-service (Redis). The browser only keeps an anonymous session id.
let sid; try{sid=localStorage.getItem('sid')}catch{}
if(!sid){sid='s'+Math.random().toString(36).slice(2,12)+Date.now().toString(36);try{localStorage.setItem('sid',sid)}catch{}}
const api=async(path,opt)=>{const r=await fetch('/api'+path,opt);let d=null;try{d=await r.json()}catch{}
  if(!r.ok) throw new Error((d&&d.detail)||('Error '+r.status));return d};
const jpost=(path,body,method='POST')=>api(path,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
const inr=n=>'₹'+Number(n).toLocaleString('en-IN');

function card(p){return `<div class="card"><div class="emoji">${p.emoji}</div><b>${esc(p.name)}</b>
<span class="muted">${esc(p.category)}</span><span class="muted">${esc(p.description)}</span>
<span class="price">${inr(p.price)}</span>
<div class="row"><button onclick="view(${p.id})">Similar</button><button class="primary" onclick="add(${p.id})">Add</button></div></div>`}

let catData=[];
function renderCats(){
  const sel=$('#cat').value;
  const all=`<div class="cat ${sel===''?'active':''}" onclick="pickCat('')"><span class="big">🛒</span><b>All products</b><span class="muted">${catData.reduce((a,c)=>a+c.count,0)} items</span></div>`;
  $('#cats').innerHTML=all+catData.map(c=>`<div class="cat ${sel===c.name?'active':''}" onclick="pickCat('${esc(c.name)}')">
    <span class="big">${c.emoji}</span><b>${esc(c.name)}</b><span class="muted">${esc(c.description)}</span>
    <span class="muted">${c.count} items · ${inr(c.min_price)} – ${inr(c.max_price)}</span></div>`).join('');
}
function pickCat(name){$('#cat').value=name;renderCats();search()}

async function search(){
  const p=new URLSearchParams({q:$('#q').value,category:$('#cat').value,sort:$('#sort').value});
  const r=await (await fetch('/api/search?'+p)).json();
  const c=catData.find(x=>x.name===$('#cat').value);
  $('#catDesc').textContent=c?`${c.emoji} ${c.name}: ${c.description}`:'';
  $('#title').textContent=($('#q').value?`Results for “${$('#q').value}”`:(c?c.name:'All products'))+` (${r.length})`;
  $('#grid').innerHTML=r.map(card).join('')||'<p class="muted">No matches.</p>';
}
async function recs(){
  const ids=[...new Set(viewed)].slice(-6).join(',');
  const r=await (await fetch('/api/recommendations?ids='+ids)).json();
  $('#recs').innerHTML=r.map(card).join('');
}
function view(id){viewed.push(id);save();recs();window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}
async function add(id){
  viewed.push(id);save();
  try{const c=await jpost(`/cart/${sid}/items`,{product_id:id,qty:1});$('#cartN').textContent=c.count}
  catch(e){alert('Could not add to cart: '+e.message)}
  recs()}
async function refreshCart(){try{const c=await api(`/cart/${sid}`);$('#cartN').textContent=c.count;return c}catch{return null}}

// ---- cart / checkout / orders drawer ----
const openPanel=html=>{$('#panel').innerHTML=html;$('#drawer').classList.add('open')};
const closePanel=()=>$('#drawer').classList.remove('open');
$('#drawer').onclick=e=>{if(e.target.id==='drawer')closePanel()};
async function showCart(msg=''){
  const c=await refreshCart();
  if(!c){openPanel('<b>Cart unavailable</b><p class="err">cart-service is not reachable.</p><button onclick="closePanel()">Close</button>');return}
  if(!c.items.length){openPanel(`<h3>Your cart</h3>${msg}<p class="muted">Your cart is empty.</p><button onclick="closePanel()">Close</button>`);return}
  const lines=c.items.map(l=>`<div class="line"><span>${l.emoji}</span><span class="n">${esc(l.name)}<br><b>${inr(l.price)}</b></span>
    <button onclick="qty(${l.product_id},${l.qty-1})">−</button><span>${l.qty}</span><button onclick="qty(${l.product_id},${l.qty+1})">+</button>
    <button onclick="qty(${l.product_id},0)">✕</button></div>`).join('');
  openPanel(`<h3>Your cart</h3>${msg}${lines}
    <div class="sum"><span>Subtotal</span><b>${inr(c.subtotal)}</b></div>
    <input id="coupon" placeholder="Coupon (try WELCOME10)"><button onclick="quote()">Apply coupon</button><div id="quoteOut"></div>
    <h4 style="margin:8px 0 0">Checkout</h4>
    <input id="ckName" placeholder="Full name"><input id="ckAddr" placeholder="Delivery address">
    <select id="ckPay"><option value="upi">UPI</option><option value="card">Card</option><option value="netbanking">Net banking</option><option value="cod">Cash on Delivery</option></select>
    <div id="ckErr" class="err"></div>
    <button class="primary" onclick="placeOrder()">Place order (demo payment)</button>
    <button onclick="closePanel()">Keep shopping</button>`);
}
async function qty(id,n){try{await jpost(`/cart/${sid}/items/${id}`,{qty:n},'PUT')}catch(e){}showCart()}
async function quote(){
  try{const q=await api(`/quote?session_id=${encodeURIComponent(sid)}&coupon=${encodeURIComponent($('#coupon').value)}`,{method:'POST'});
    $('#quoteOut').innerHTML=`<div class="sum"><span>Discount</span><span>−${inr(q.discount)}</span></div><div class="sum"><span>Shipping</span><span>${q.shipping?inr(q.shipping):'Free'}</span></div><div class="sum t"><span>Total</span><span>${inr(q.total)}</span></div>`}
  catch(e){$('#quoteOut').innerHTML=`<div class="err">${esc(e.message)}</div>`}
}
async function placeOrder(){
  $('#ckErr').textContent='';
  try{const o=await jpost('/orders',{session_id:sid,name:$('#ckName').value,address:$('#ckAddr').value,
      payment:$('#ckPay').value,coupon:$('#coupon').value||null});
    await refreshCart();
    openPanel(`<h3 class="ok">✅ Order placed!</h3><p>Order <b>${esc(o.order_id)}</b> · ${esc(o.status)}<br>Total paid: <b>${inr(o.total)}</b></p>
      <button onclick="showOrders()">View my orders</button><button onclick="closePanel()">Close</button>`)}
  catch(e){$('#ckErr').textContent=e.message}
}
async function showOrders(){
  let list=[];try{list=await api('/orders?session_id='+encodeURIComponent(sid))}catch(e){openPanel(`<p class="err">${esc(e.message)}</p><button onclick="closePanel()">Close</button>`);return}
  openPanel(`<h3>My orders</h3>`+(list.length?list.map(o=>`<div class="order"><b>${esc(o.order_id)}</b> · ${esc(o.status)} · ${inr(o.total)}<br>
    <span class="muted">${o.items.map(i=>esc(i.name)+' ×'+i.qty).join(', ')}<br>Ship to: ${esc(o.customer)}, ${esc(o.address)}</span></div>`).join(''):'<p class="muted">No orders yet.</p>')+
    '<button onclick="closePanel()">Close</button>');
}
$('#cartBtn').onclick=()=>showCart();$('#ordersBtn').onclick=showOrders;

let t;$('#q').oninput=()=>{clearTimeout(t);t=setTimeout(search,250)};
$('#cat').onchange=()=>{renderCats();search()};$('#sort').onchange=search;

const DEFAULT_CHIPS=['What do you sell?','Best under ₹3000','Gym essentials','Cheapest electronics','Return policy'];
const WELCOME="Hi! I can search products, compare them, add items to your cart and answer questions about delivery and returns.";
let ctx={};
function setChips(list){const c=$('#chips');c.innerHTML='';list.slice(0,5).forEach(t=>{const b=document.createElement('button');b.type='button';b.textContent=t;b.onclick=()=>send(t);c.appendChild(b)})}
$('#chatBtn').onclick=()=>$('#chat').classList.toggle('open');
function say(text,who){const d=document.createElement('div');d.className='msg '+who;d.textContent=text;$('#log').appendChild(d);$('#log').scrollTop=1e9;return d}
function cards(list){
  list.forEach(p=>{
    const d=document.createElement('div');d.className='mini';
    d.innerHTML=`<span>${p.emoji}</span><span class="n">${esc(p.name)}<br><b>${inr(p.price)}</b></span><button type="button">Details</button><button type="button" class="primary">Add</button>`;
    const [det,addb]=d.querySelectorAll('button');
    det.onclick=()=>send('Tell me about '+p.name);
    addb.onclick=()=>{add(p.id);addb.textContent='Added ✓'};
    $('#log').appendChild(d)});
  $('#log').scrollTop=1e9;
}
async function send(m){
  say(m,'me');const typing=say('Thinking…','bot typing');
  try{
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:m,history:history.slice(-10),context:ctx})});
    if(!res.ok) throw new Error(res.status);
    const r=await res.json();typing.remove();
    ctx=r.context||ctx;history.push({role:'user',content:m},{role:'assistant',content:r.reply});
    say(r.reply,'bot');cards(r.products||[]);
    (r.actions||[]).forEach(a=>{if(a.type==='add_to_cart')add(a.product_id)});
    setChips(r.suggestions&&r.suggestions.length?r.suggestions:DEFAULT_CHIPS);
    $('#mode').textContent=r.mode==='llm'?'AI mode':'Smart mode';
  }catch(e){typing.remove();say('Sorry, the assistant is unavailable right now. Please try again.','bot')}
}
$('#chatForm').onsubmit=e=>{e.preventDefault();const m=$('#chatIn').value.trim();if(!m)return;$('#chatIn').value='';send(m)};
$('#newChat').onclick=()=>{history=[];ctx={};$('#log').innerHTML='';say(WELCOME,'bot');setChips(DEFAULT_CHIPS)};

(async()=>{
  try{
    const cats=await (await fetch('/api/categories')).json();
    $('#cat').insertAdjacentHTML('beforeend',cats.map(c=>`<option>${esc(c)}</option>`).join(''));
  }catch(e){}
  try{
    const r=await fetch('/api/categories/details');
    if(!r.ok) throw new Error(r.status);
    catData=await r.json();renderCats();
  }catch(e){
    $('#warn').style.display='block';
    $('#warn').textContent='Category details unavailable: catalog-service is not reachable through the gateway. Check /api/status.';
  }
  try{const v=await api('/version');let st='';try{const s=await api('/status');const n=Object.values(s.services);st=` · ${n.filter(x=>x.up).length}/${n.length} services up`}catch{}$('#ver').textContent='Gateway '+v.version+st}catch(e){$('#ver').textContent='Gateway unreachable'}
  setChips(DEFAULT_CHIPS);$('#mode').textContent='…';
  refreshCart();search();recs();
})();
</script>
</body>
</html>
