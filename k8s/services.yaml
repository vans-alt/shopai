apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  type: ClusterIP          # internal only
  selector: {app: gateway}
  ports:
    - port: 8000
      targetPort: 8000
# All services are ClusterIP (internal) except frontend (public LoadBalancer).
---
