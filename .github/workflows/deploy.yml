name: Build and deploy to AKS
on:
  push: {branches: [main]}
  workflow_dispatch:
env:
  ACR_NAME: ${{ secrets.ACR_NAME }}
  RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}
  CLUSTER_NAME: ${{ secrets.CLUSTER_NAME }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with: {creds: "${{ secrets.AZURE_CREDENTIALS }}"}
      - name: Build all 7 images in ACR
        run: |
          for s in gateway catalog search chatbot cart order; do
            az acr build -r $ACR_NAME -t shopai-$s:${{ github.sha }} ./services/$s
          done
          az acr build -r $ACR_NAME -t shopai-frontend:${{ github.sha }} ./frontend
      - uses: azure/aks-set-context@v4
        with: {resource-group: "${{ env.RESOURCE_GROUP }}", cluster-name: "${{ env.CLUSTER_NAME }}"}
      - name: Deploy
        run: |
          sed -i "s|ACR_NAME|$ACR_NAME|g; s|IMAGE_TAG|${{ github.sha }}|g" k8s/deployments.yaml
          kubectl apply -f k8s/databases.yaml -f k8s/deployments.yaml -f k8s/services.yaml   # secret shopai-db-secrets must exist (see README)
          for d in redis mongo mysql catalog search chatbot cart order gateway frontend; do
            kubectl rollout status deployment/$d --timeout=240s
          done
